# Fork-specific test build: publish the HRV-fix image to GHCR (no upstream release).
#
# Builds the repository's existing Dockerfile from the IMMUTABLE source tag
# v0.5.0-hrv-fix and pushes a test image to:
#     ghcr.io/metiq-solutions/garmin-fetch-data:v0.5.0-hrv-fix
#
# This image is for private production validation BEFORE an upstream PR is
# submitted. It intentionally does NOT publish to Docker Hub, does NOT touch
# any upstream image/release, and is manually dispatched only.
#
# Release workflow parity: mirrors the multi-arch (linux/amd64, linux/arm64)
# behavior and action versions used by .github/workflows/prod.push.yml, but
# authenticates to ghcr.io with the repository's GITHUB_TOKEN instead of a PAT
# or Docker Hub credentials.

name: fork-hrv-fix-image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-hrv-fix-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/metiq-solutions/garmin-fetch-data
  IMAGE_TAG: v0.5.0-hrv-fix
  SOURCE_TAG: v0.5.0-hrv-fix
  EXPECTED_COMMIT: 873fb2480d9b1cd641d8ef24579de855c90018a8

jobs:
  build_and_push:
    name: Build and push GHCR test image
    # Guard: this workflow is fork-specific; never run it against upstream.
    if: ${{ github.repository == 'METIQ-Solutions/garmin-grafana' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout immutable tagged source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.SOURCE_TAG }}
          fetch-depth: 0
          fetch-tags: true

      - name: Verify immutable tag resolves to the tested commit
        run: |
          set -euo pipefail
          actual="$(git rev-parse "refs/tags/${SOURCE_TAG}^{commit}")"
          echo "source tag ${SOURCE_TAG} resolves to ${actual}"
          if [[ "${actual}" != "${EXPECTED_COMMIT}" ]]; then
            echo "::error::refs/tags/${SOURCE_TAG} resolves to ${actual}, expected ${EXPECTED_COMMIT}. Aborting build."
            exit 1
          fi
          echo "Verified: refs/tags/${SOURCE_TAG} -> ${EXPECTED_COMMIT}"
          echo "SOURCE_COMMIT=${actual}" >> "$GITHUB_ENV"

      - name: Set up QEMU for Multi-Architecture Support
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.SOURCE_COMMIT }}
            org.opencontainers.image.version=${{ env.IMAGE_TAG }}

      - name: Record image digest
        run: |
          echo "IMAGE_DIGEST=${{ steps.build.outputs.digest }}" >> "$GITHUB_ENV"
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Published HRV-fix test image
          - Image: `ghcr.io/metiq-solutions/garmin-fetch-data:v0.5.0-hrv-fix`
          - Digest: `${{ steps.build.outputs.digest }}`
          - Source commit: `${{ env.SOURCE_COMMIT }}`
          - Platforms: `linux/amd64`, `linux/arm64`
          EOF

      - name: Sanity check published image (installed source)
        run: |
          set -euo pipefail
          docker run --pull=always --rm \
            --entrypoint python \
            "${{ env.IMAGE }}:${{ env.IMAGE_TAG }}" \
            -c "import pathlib; p=pathlib.Path('/app/garmin_grafana/garmin_fetch.py'); s=p.read_text(encoding='utf-8',errors='replace'); hits=[l for l in s.splitlines() if 'avgOvernightHrv' in l]; assert hits, 'no avgOvernightHrv line found'; l=hits[0]; assert 'float(val)' in l and 'is not None' in l, f'unexpected line: {l}'; print('OK: installed garmin_fetch.py normalizes avgOvernightHrv to float; None preserved'); print(l.strip())"
